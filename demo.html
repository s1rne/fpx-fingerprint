<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf8">
<title>FPX lab — демо коллектора</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #fafafa; color: #222; }
  h1 { font-size: 22px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 18px 22px; margin-bottom: 16px; }
  pre { background: #f4f4f4; padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 400px; }
  button { background: #1a7f37; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-right: 8px; }
  input { padding: 8px; margin-right: 8px; }
</style>
</head>
<body>
<h1>FPX — что ваш браузер рассказывает о вас</h1>
<div class="card">
  <p>Подвигайте мышью, покликайте, попечатайте — потом нажмите «Собрать данные».</p>
  <input id="demo-input" placeholder="напечатайте что-нибудь">
  <button onclick="run()">Собрать данные</button>
  <button onclick="runHash()">Только device hash</button>
</div>
<div class="card"><pre id="out">…</pre></div>
<script src="fpx.js"></script>
<script>
  Fpx.init({ limit: 2000 });
  async function run() {
    const d = await Fpx.collectData();
    document.getElementById('out').textContent = JSON.stringify(d, null, 1);
  }
  async function runHash() {
    const h = await Fpx.deviceHash();
    document.getElementById('out').textContent = 'deviceHash: ' + h;
  }
</script>
</body>
</html>
